<ion-header>
  <ion-toolbar color="light">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login" />
    </ion-buttons>
    <ion-title>{{ L().emailLinkTitle }}</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>
  <ion-card>
    @if (!emailFromStorage()) {
      <p>{{ L().emailLinkRetype }}</p>
    }
    <ion-item>
      <ion-icon name="mail-outline" slot="start" />
      <ion-input
        [label]="L().email"
        [required]="true"
        [readonly]="isSigning()"
        [value]="email()"
        [disabled]="emailFromStorage() || isSigning()"
      />
    </ion-item>

    <ion-button [disabled]="isSigning()" (click)="signIn()">
      <ion-label>
        @if (isSigning()) {
          {{ L().signingIn }}
        } @else {
          {{ L().signIn }}
        }
      </ion-label>
    </ion-button>
  </ion-card>
</ion-content>

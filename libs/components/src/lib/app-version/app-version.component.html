<ion-item-divider color="light">
  <ion-label>App version</ion-label>
</ion-item-divider>
<ion-item lines="none">
  <ion-label>Version</ion-label>
  <ion-note slot="end" data-testid="build-info-version">{{
    buildInfo.version
  }}</ion-note>
</ion-item>
<ion-item lines="none">
  <ion-label>Build</ion-label>
  <ion-note
    slot="end"
    data-testid="build-info-hash"
    [title]="buildInfo.gitHash"
    >{{ shortGitHash }} @ {{ buildInfo.buildTimestamp }}</ion-note
  >
</ion-item>

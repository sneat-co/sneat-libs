<ion-list>
  <ion-item class="sneat-pane-header">
    <!--		<ion-icon [name]="space.type === 'family' ? 'people-outline' : space.type === 'private' ? 'person-circle-outline' : 'people-outline' " slot="end" />-->
    <sneat-space-selector
      [closeMenuOnSelection]="true"
      justify="space-between"
    />
    <!--		@if (!spaces) {-->
    <!--			<ion-spinner name="lines" slot="end"></ion-spinner>-->
    <!--		}-->
  </ion-item>
  <ion-item
    tappable
    [routerLink]="spacePageUrl('overview')"
    [disabled]="$disabled()"
    [class.currentPage]="$currentPage() === ''"
    (click)="goOverview()"
  >
    <ion-icon name="home-outline" slot="start" />
    <ion-label>Overview</ion-label>
  </ion-item>
  <ion-item
    tappable
    [routerLink]="spacePageUrl('members')"
    routerDirection="root"
    [disabled]="$disabled()"
    [class.currentPage]="$currentPage() === 'members'"
    (click)="closeMenu()"
  >
    <ion-icon name="people-circle-outline" slot="start" />
    <ion-label>Members</ion-label>
  </ion-item>
  <ion-item
    tappable
    lines="none"
    class="sneat-no-bottom-border"
    [routerLink]="spacePageUrl('calendar')"
    routerDirection="root"
    [disabled]="$disabled()"
    [class.currentPage]="$currentPage() === 'calendar'"
    (click)="closeMenu()"
  >
    <ion-icon name="calendar-outline" slot="start" />
    <ion-label>Calendar</ion-label>
  </ion-item>
  <ion-item-divider color="header">
    <ion-label color="medium">Extensions</ion-label>
  </ion-item-divider>
  <sneat-space-extension-links
    [$space]="$space()"
    [$presentation]="'menu'"
    [$currentPage]="$currentPage()"
    [$disabled]="$disabled()"
    (linkSelected)="closeMenu()"
  />
  <sneat-auth-menu-item />
</ion-list>

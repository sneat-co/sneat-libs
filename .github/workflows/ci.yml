name: CI
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: pnpm install --frozen-lockfile
      # A releasable package changed without a .nx/version-plans/*.md plan
      # would merge green and publish nothing (backstage lesson
      # a-successful-release-run-must-not-hide-a-noop-publication).
      - name: Version plan check
        if: github.event_name == 'pull_request'
        run: |
          # On pull_request the checkout is the synthetic merge commit, so HEAD^1
          # is the live base tip (the payload's base.sha can be stale).
          # A genuine release PR (release.yml) consumes the plans and bumps
          # versions, so it legitimately touches packages with no plan. It is
          # recognised by the same validator publish.yml uses: non-empty output
          # means a valid candidate; an invalid one fails the job.
          candidate="$(node tools/verify-release-candidate.mjs --committed --version)"
          if [ -n "$candidate" ]; then
            echo "Release candidate $candidate: exempt from the plan check."
            exit 0
          fi
          pnpm nx release plan:check --base=HEAD^1 --head=HEAD
      - run: node --test tools/verify-release-candidate.test.mjs
      - run: pnpm nx run-many -t build,test,lint --all
      - run: pnpm run verify:bootstrap-boundaries
      - run: pnpm run verify:capacitor-peers

name: CI
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: pnpm install --frozen-lockfile
      # A releasable package changed without a .nx/version-plans/*.md plan
      # would merge green and publish nothing (backstage lesson
      # a-successful-release-run-must-not-hide-a-noop-publication).
      # Release PRs (release.yml) consume the plans, so they are exempt.
      - name: Version plan check
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/sneat-libs-')
        run: pnpm nx release plan:check --base=${{ github.event.pull_request.base.sha }} --head=HEAD
      - run: node --test tools/verify-release-candidate.test.mjs
      - run: pnpm nx run-many -t build,test,lint --all
      - run: pnpm run verify:bootstrap-boundaries
      - run: pnpm run verify:capacitor-peers

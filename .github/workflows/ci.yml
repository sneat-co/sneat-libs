name: CI
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: node --test tools/verify-release-candidate.test.mjs
      - run: pnpm nx run-many -t build,test,lint --all
      - run: pnpm run verify:bootstrap-boundaries
      - run: pnpm run verify:capacitor-peers

  '@tree-sitter-grammars/tree-sitter-hcl': true
  core-js: true
  esbuild: true
  less: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  oxc-resolver: true
  protobufjs: true
  re2: true
  unrs-resolver: true
